name: tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      AML_EMBED_ENABLED: "false"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.lock
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r requirements.lock
      - run: python -m unittest discover -s tests -v
      - run: python scripts/smoke_local.py
      - run: python -m benchmarks.run_benchmark --suite extended --fail-on-miss
        env:
          AML_EMBED_ENABLED: "true"

  docker-offline-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - name: Build image for the exact commit
        run: docker build --build-arg VCS_REF="$GITHUB_SHA" -t agent-memory-challenge:ci .
      - name: Verify immutable image identity
        run: |
          IMAGE_ID="$(docker image inspect -f '{{.Id}}' agent-memory-challenge:ci)"
          IMAGE_REVISION="$(docker image inspect -f '{{index .Config.Labels "org.opencontainers.image.revision"}}' agent-memory-challenge:ci)"
          python scripts/release_manifest.py --image-id "$IMAGE_ID" \
            --image-revision "$IMAGE_REVISION" --output release-manifest.json
          cat release-manifest.json
      - name: Preserve release manifest
        uses: actions/upload-artifact@v7
        with:
          name: release-manifest-${{ github.sha }}
          path: release-manifest.json
          if-no-files-found: error
          retention-days: 30
      - name: Verify baked model under offline memory limit
        run: |
          if docker run --rm --network none agent-memory-challenge:ci > missing-key.log 2>&1; then
            echo "container unexpectedly started without an API key"
            exit 1
          fi
          grep -q "AML_API_KEY or API_KEY must be set" missing-key.log
          docker volume create aml-ci-data
          docker run -d --name aml-ci --network none --memory 512m --memory-swap 512m \
            --pids-limit 256 -e AML_API_KEY=ci-secret -e AML_MEMORY_CACHE_USERS=1 \
            -v aml-ci-data:/data \
            agent-memory-challenge:ci
          test "$(docker inspect -f '{{.HostConfig.Memory}}' aml-ci)" = "536870912"
          for attempt in $(seq 1 30); do
            docker exec aml-ci python -c "import urllib.request; assert urllib.request.urlopen('http://127.0.0.1:8000/health').status == 200" && break
            sleep 2
          done
          docker exec -i aml-ci python - <<'PY'
          import json
          import urllib.request

          def post(path, payload):
              request = urllib.request.Request(
                  "http://127.0.0.1:8000" + path,
                  data=json.dumps(payload).encode(),
                  headers={"Authorization": "Bearer ci-secret", "Content-Type": "application/json"},
              )
              with urllib.request.urlopen(request) as response:
                  return json.load(response)

          messages = [
              {"role": "user", "content": f"Record {index} has project code ci-code-{index}."}
              for index in range(250)
          ]
          messages.append({"role": "user", "content": "My emergency contact is Jordan."})
          post("/add", {
              "request_id": "ci-offline", "user_id": "alice", "session_id": "session",
              "messages": messages,
          })
          from concurrent.futures import ThreadPoolExecutor
          with ThreadPoolExecutor(max_workers=8) as executor:
              results = list(executor.map(
                  lambda _: post("/search", {
                      "query": "emergency contact", "user_id": "alice", "top_k": 10,
                  }),
                  range(16),
              ))
          assert all("Jordan" in result["data"][0]["content"] for result in results)
          PY
          docker stop aml-ci
          docker rm aml-ci
          docker run -d --name aml-ci --network none --memory 512m --memory-swap 512m \
            --pids-limit 256 -e AML_API_KEY=ci-secret -e AML_MEMORY_CACHE_USERS=1 \
            -v aml-ci-data:/data \
            agent-memory-challenge:ci
          for attempt in $(seq 1 30); do
            docker exec aml-ci python -c "import urllib.request; assert urllib.request.urlopen('http://127.0.0.1:8000/health').status == 200" && break
            sleep 2
          done
          docker exec -i aml-ci python - <<'PY'
          import json
          import urllib.request

          def post(path, payload):
              request = urllib.request.Request(
                  "http://127.0.0.1:8000" + path,
                  data=json.dumps(payload).encode(),
                  headers={"Authorization": "Bearer ci-secret", "Content-Type": "application/json"},
              )
              with urllib.request.urlopen(request) as response:
                  return json.load(response)

          result = post("/search", {
              "query": "emergency contact", "user_id": "alice", "top_k": 10,
          })
          assert "Jordan" in result["data"][0]["content"]

          messages = [
              {"role": "user", "content": f"Record {index} has project code ci-code-{index}."}
              for index in range(250)
          ]
          messages.append({"role": "user", "content": "My emergency contact is Jordan."})
          replay = post("/add", {
              "request_id": "ci-offline", "user_id": "alice", "session_id": "session",
              "messages": messages,
          })
          assert replay["success"] is True

          import sqlite3
          with sqlite3.connect("/data/memory.db") as connection:
              assert connection.execute("SELECT COUNT(*) FROM memories").fetchone()[0] == 251
              assert connection.execute("SELECT COUNT(*) FROM add_requests").fetchone()[0] == 1
          PY
          test "$(docker inspect -f '{{.State.OOMKilled}}' aml-ci)" = "false"
          docker exec -i aml-ci python - <<'PY'
          import json
          from pathlib import Path

          cgroup = Path("/sys/fs/cgroup")
          if (cgroup / "memory.current").exists():
              current = int((cgroup / "memory.current").read_text())
              peak = int((cgroup / "memory.peak").read_text())
              limit = int((cgroup / "memory.max").read_text())
              events = dict(
                  line.split() for line in (cgroup / "memory.events").read_text().splitlines()
              )
              oom_kills = int(events["oom_kill"])
          else:
              memory = cgroup / "memory"
              current = int((memory / "memory.usage_in_bytes").read_text())
              peak = int((memory / "memory.max_usage_in_bytes").read_text())
              limit = int((memory / "memory.limit_in_bytes").read_text())
              oom_kills = int((memory / "memory.failcnt").read_text())
          print(json.dumps({"current": current, "peak": peak, "limit": limit, "oom_kills": oom_kills}))
          assert limit == 512 * 1024 * 1024
          assert current < limit * 0.95
          assert oom_kills == 0
          PY
          docker stats --no-stream aml-ci
